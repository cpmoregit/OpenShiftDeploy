apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: your-namespace  # Replace with your desired namespace
  name: testadminrole
rules:
  - apiGroups: 
      - ""  # Core API group for pods
    resources: 
      - pods  # Specify the resources
    verbs: 
      - get
      - list
      - create
      - update
      - delete
      - exec
